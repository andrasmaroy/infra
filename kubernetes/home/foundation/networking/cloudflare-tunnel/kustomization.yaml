---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repository.yaml
  - release.yaml
  - image-updates.yaml
  - alerts.yaml

secretGenerator:
  - name: cloudflare-tunnel-credentials
    namespace: networking
    files:
      - credentials.json=credentials.sops.json
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
configurations:
  - kustomizeconfig.yaml
