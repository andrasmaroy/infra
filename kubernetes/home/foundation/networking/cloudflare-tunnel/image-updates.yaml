---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageRepository
metadata:
  name: cloudflare-tunnel
  namespace: flux-system
spec:
  image: docker.io/cloudflare/cloudflared
  interval: 24h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImagePolicy
metadata:
  name: cloudflare-tunnel
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: cloudflare-tunnel
  filterTags:
    pattern: '^(?P<semver>\d+\.\d+\.\d+)$'
    extract: '$semver'
  policy:
    semver:
      range: '*'
